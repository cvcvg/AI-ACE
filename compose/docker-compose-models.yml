services:


  qwen3-text-service:


    profiles:

      - qwen3



    image:

      ghcr.io/ggml-org/llama.cpp:server-cuda



    container_name:

      qwen3-text-service



    command:

      - "-m"
      - "/models/Qwen3-4B-Q4_K_M.gguf"

      - "--host"
      - "0.0.0.0"

      - "--port"
      - "8081"

      - "--n-gpu-layers"
      - "999"



    ports:

      - "127.0.0.1:8081:8081"



    volumes:

      - D:/AI-ACE/models/qwen3-4b:/models:ro



    deploy:

      resources:

        reservations:

          devices:

            - driver: nvidia

              count: 1

              capabilities: [gpu]



    networks:

      - ai-private-net



    restart:

      unless-stopped






  deepseek-service:


    profiles:

      - deepseek



    image:

      ghcr.io/ggml-org/llama.cpp:server-cuda



    container_name:

      deepseek-service



    command:

      - "-m"
      - "/models/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf"

      - "--host"
      - "0.0.0.0"

      - "--port"
      - "8082"

      - "--n-gpu-layers"
      - "999"



    ports:

      - "127.0.0.1:8082:8082"



    volumes:

      - D:/AI-ACE/models/deepseek-r1-7b:/models:ro



    deploy:

      resources:

        reservations:

          devices:

            - driver: nvidia

              count: 1

              capabilities: [gpu]



    networks:

      - ai-private-net



    restart:

      unless-stopped






  vision-service-model:


    profiles:

      - vision



    image:

      ghcr.io/ggml-org/llama.cpp:server-cuda



    container_name:

      vision-service-model



    command:


      - "-m"

      - "/models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"


      - "--mmproj"

      - "/models/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf"


      - "--host"

      - "0.0.0.0"


      - "--port"

      - "8083"


      - "--n-gpu-layers"

      - "999"



    ports:


      - "127.0.0.1:8083:8083"



    volumes:


      - D:/AI-ACE/models/vision:/models:ro



    deploy:


      resources:


        reservations:


          devices:


            - driver: nvidia

              count: 1

              capabilities: [gpu]



    networks:


      - ai-private-net



    restart:


      unless-stopped




networks:


  ai-private-net:


    name:

      ai-private-net


    external:

      true